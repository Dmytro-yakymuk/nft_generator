name: "Go"
on:
  push:
    branches: [ master, platform-update ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: generatordb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      # the version of go.mod and of the server image (golang:1.17-alpine)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.17.13'
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          # .golangci.yml is in the format of golangci-lint v1
          version: v1.54.2
      - name: Test
        env:
          GENERATOR_TEST_DB: postgres://postgres:postgres@localhost:5432/generatordb_test?sslmode=disable
        run: go test -race ./...
